version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eduagent_postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - eduagent_network

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduagent_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - eduagent_network

volumes:
  postgres_production_data:

networks:
  eduagent_network:
    driver: bridge